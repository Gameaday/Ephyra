<svg xmlns="http://www.w3.org/2000/svg" width="256" height="64" viewBox="0 0 256 64" role="img" aria-labelledby="elg-title elg-desc">
  <title id="elg-title">Ephyra</title>
  <desc id="elg-desc">Ephyra geometric lockup: the sharp-cornered page-bar mark followed by a geometric Ephyra wordmark.</desc>

  <!-- Mark -->
  <rect x="8" y="8" width="48" height="48" fill="#0E4C5C"/>
  <path d="M56 32 L56 56 L32 56 Z" fill="#0A3A47"/>
  <g fill="#F5F1E8">
    <rect x="20.4" y="18.4" width="5.25" height="27"/>
    <rect x="20.4" y="18.4" width="23.25" height="5.25"/>
    <rect x="20.4" y="29.28" width="16.5" height="5.25"/>
    <rect x="20.4" y="40.15" width="23.25" height="5.25"/>
  </g>
  <path d="M20.4 49.5 L32 45.3 L43.6 49.5 L43.6 53.2 L32 49 L20.4 53.2 Z" fill="#FF7A59"/>

  <!-- Wordmark: geometric lettering, square terminals -->
  <g fill="none" stroke="#0E4C5C" stroke-width="7" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M101 15 H81 V47 H101 M81 31 H97"/>
    <path d="M108 25 V55"/>
    <path d="M108 36 H128 M128 25 V47"/>
    <path d="M136 15 V47 M136 30 C136 25 139 22 145 22 C151 22 154 25 154 30 V47"/>
    <path d="M162 25 L172 42"/>
    <path d="M184 25 L174 42 C171 47 168 50 164 52"/>
    <path d="M193 25 V47 M193 33 Q193 25 202 25 Q208 25 209 27"/>
    <path d="M218 25 V47 M218 36 H234 M234 25 V47"/>
  </g>
</svg>
