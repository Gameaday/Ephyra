name: Diagnose

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose.yml'
  workflow_dispatch:
    inputs:
      run_id:
        required: false
      issue_number:
        required: false

permissions:
  actions: read
  pull-requests: write
  issues: write

jobs:
  diagnose:
    runs-on: 'ubuntu-24.04'
    env:
      RUN_ID: ${{ inputs.run_id || '42960233975' }}
      ISSUE: ${{ inputs.issue_number || '351' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Analyse failed job log
        run: |
          set -euo pipefail
          {
            echo "## Job log triage for run $RUN_ID (commit 70a7d7c)"
            echo
            JOBS_JSON=$(gh api "repos/Gameaday/Ephyra/actions/runs/$RUN_ID/jobs?per_page=100")
            FAILED_JOB=$(echo "$JOBS_JSON" | jq -r '[.jobs[] | select(.conclusion == "failure")][0].id')
            echo "Failed job id: $FAILED_JOB"
            gh api "repos/Gameaday/Ephyra/actions/jobs/$FAILED_JOB/logs" > job.log 2>job_err.log || echo "log download failed: $(cat job_err.log)"
            if [ -s job.log ]; then
              echo "### First FAILURE context"
              echo '```'
              grep -n -m 5 -E 'FAILURE:|> Task .* FAILED|What went wrong|Caused by:|BUILD FAILED' job.log | sed -n '1,20p'
              echo '```'
              echo
              FIRST=$(grep -n -m 1 -E 'FAILURE:|BUILD FAILED' job.log | cut -d: -f1)
              if [ -n "$FIRST" ]; then
                START=$(( FIRST > 15 ? FIRST - 15 : 1 ))
                echo "### Context around first failure (lines $START-)"
                echo '```'
                sed -n "${START},$(( FIRST + 60 ))p" job.log | cut -c1-500
                echo '```'
              fi
              echo
              echo "### Gradle task failures"
              echo '```'
              grep -n -E '^> Task .*FAILED$' job.log | sed -n '1,20p'
              echo '```'
            fi
          } > summary.md
          gh api -X POST "repos/Gameaday/Ephyra/issues/$ISSUE/comments" -f body="$(cat summary.md)"
          echo "Posted."
