name: Diagnose unit test failures

# Throwaway diagnostic for PR #353 round 4 (deleted before merge). Downloads the
# already-produced test-report artifact and posts failing testcases with stack
# frames. Does NOT invoke the Gradle suite (WorkflowRedundancyTest).
on:
  push:
    branches:
      - fix/history-stack-by-series
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-24.04
    steps:
      - name: Download test report artifact
        run: |
          set -euo pipefail
          gh api repos/Gameaday/Ephyra/actions/artifacts/13826710192/zip > /tmp/report.zip
          mkdir -p /tmp/report
          unzip -q -o /tmp/report.zip -d /tmp/report
          echo "xml files: $(find /tmp/report -name 'TEST-*.xml' | wc -l)"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Summarise failures
        run: |
          set -euo pipefail
          {
            echo "**Diagnose (PR #353 round 4, take 2):** failing testcases with stack frames from run 42953113267 (head aa77054)."
            found=0
            for f in $(find /tmp/report -name 'TEST-*.xml'); do
              if grep -q '<failure' "$f"; then
                found=1
                echo "### $(echo "$f" | sed 's#/tmp/report/##')"
                grep -B1 -A12 '<failure' "$f" | sed 's/&#10;/ NEWLINE /g' | cut -c1-400 | head -80
                echo
              fi
            done
            if [ "$found" = "0" ]; then
              echo "No <failure> element in any downloaded test-result XML."
            fi
          } > /tmp/summary.md
          wc -c /tmp/summary.md
          cat /tmp/summary.md

      - name: Post to PR
        run: gh pr comment 353 --repo Gameaday/Ephyra --body-file /tmp/summary.md
        env:
          GH_TOKEN: ${{ github.token }}
