name: Diagnose

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id whose test-report artifact to download'
        required: false
      issue_number:
        description: 'Issue or PR number to post findings to'
        required: false

permissions:
  actions: read
  pull-requests: write
  issues: write

jobs:
  diagnose:
    runs-on: 'ubuntu-24.04'
    env:
      RUN_ID: ${{ inputs.run_id || '42960233975' }}
      ISSUE: ${{ inputs.issue_number || '351' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download and analyse test reports
        run: |
          set -euo pipefail
          echo "Analysing run $RUN_ID, posting to issue/PR $ISSUE"
          ART_ID=$(gh api "repos/Gameaday/Ephyra/actions/runs/$RUN_ID/artifacts" --jq '[.artifacts[] | select(.name | startswith("test-report"))][0].id')
          echo "Artifact id: $ART_ID"
          gh api "repos/Gameaday/Ephyra/actions/artifacts/$ART_ID/zip" > artifact.zip
          mkdir -p reports
          unzip -q artifact.zip -d reports
          {
            echo "## Failing unit tests on run $RUN_ID (commit 70a7d7c)"
            echo
            found=0
            while IFS= read -r f; do
              if grep -q '<failure' "$f"; then
                found=1
                echo "### $f"
                echo
                echo '```'
                grep -o 'testcase name="[^"]*" classname="[^"]*"' "$f"
                grep -o '<failure[^>]*message="[^"]*"' "$f" | cut -c1-1500
                echo '```'
                echo
              fi
            done < <(find reports -name 'TEST-*.xml')
            if [ "$found" = "0" ]; then
              echo "No <failure> element found in any downloaded test result. Files in artifact:"
              echo '```'
              find reports -type f | sed -n '1,50p'
              echo '```'
            fi
          } > summary.md
          gh api -X POST "repos/Gameaday/Ephyra/issues/$ISSUE/comments" -f body="$(cat summary.md)"
          echo "Posted."
