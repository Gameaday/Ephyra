name: Diagnose

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose.yml'
  workflow_dispatch:
    inputs:
      run_id:
        required: false
      issue_number:
        required: false

permissions:
  actions: read
  pull-requests: write
  issues: write

jobs:
  diagnose:
    runs-on: 'ubuntu-24.04'
    env:
      RUN_ID: ${{ inputs.run_id || '42960233975' }}
      ISSUE: ${{ inputs.issue_number || '351' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Analyse failed job log
        run: |
          set -uo pipefail
          {
            echo "## Job log triage for run $RUN_ID (commit 70a7d7c)"
            echo
            FAILED_JOB=$(gh api "repos/Gameaday/Ephyra/actions/runs/$RUN_ID/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion == "failure")][0].id' || echo none)
            echo "Failed job id: $FAILED_JOB"
            if [ "$FAILED_JOB" != "none" ]; then
              curl -sL -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/Gameaday/Ephyra/actions/jobs/$FAILED_JOB/logs" -o job.log || true
              echo "Log bytes: $(wc -c < job.log)"
              tr -d '\000-\010\013\014\016-\037' < job.log > job_clean.log || true
              echo
              echo "### First FAILURE context"
              echo '```'
              grep -n -m 5 -E 'FAILURE:|> Task .* FAILED|What went wrong|BUILD FAILED' job_clean.log | cut -c1-400 || echo "(no match)"
              echo '```'
              echo
              FIRST=$(grep -n -m 1 -E 'FAILURE:|BUILD FAILED' job_clean.log | cut -d: -f1 || true)
              if [ -n "$FIRST" ]; then
                START=$(( FIRST > 15 ? FIRST - 15 : 1 ))
                echo "### Context (lines $START onward, 80 lines)"
                echo '```'
                sed -n "${START},$(( FIRST + 60 ))p" job_clean.log | cut -c1-500
                echo '```'
              fi
              echo
              echo "### Gradle task failures"
              echo '```'
              grep -n -E '^> Task .*FAILED' job_clean.log | cut -c1-300 || echo "(none)"
              echo '```'
              echo
              echo "### Log tail (last 1500 bytes, cleaned)"
              echo '```'
              tail -c 1500 job_clean.log
              echo
              echo '```'
            fi
          } > summary.md
          gh api -X POST "repos/Gameaday/Ephyra/issues/$ISSUE/comments" -f body="$(cat summary.md)"
          echo "Posted."
