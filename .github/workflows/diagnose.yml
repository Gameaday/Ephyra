name: Diagnose

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose.yml'
  workflow_dispatch:
    inputs:
      run_id:
        required: false
      issue_number:
        required: false

permissions:
  actions: write
  pull-requests: write
  issues: write

jobs:
  diagnose:
    runs-on: 'ubuntu-24.04'
    env:
      RUN_ID: ${{ inputs.run_id || '42960233975' }}
      ISSUE: ${{ inputs.issue_number || '351' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Rerun failed jobs of the triaged run
        run: |
          set -uo pipefail
          gh api -X POST "repos/Gameaday/Ephyra/actions/runs/$RUN_ID/rerun-failed-jobs" > rerun_resp.txt 2>&1 || true
          echo "Rerun response: $(cat rerun_resp.txt)"
          {
            echo "## Rerun triggered for failed jobs of run $RUN_ID (commit 70a7d7c)"
            echo
            echo "Root cause from job log (job 130324857024):"
            echo
            echo '```'
            echo "Execution failed for task ':feature:reader:testDebugUnitTest'"
            echo "> Test process encountered an unexpected problem."
            echo "   > Could not complete execution for Gradle Test Executor 19."
            echo "      > TestEngine with ID 'junit-vintage' failed to discover tests"
            echo '```'
            echo
            echo "No assertion failures in any uploaded test-report XML - the reader module's"
            echo "test JVM died during test discovery. Not an assertion regression; testing"
            echo "reproducibility by rerunning the failed jobs now."
          } > summary.md
          gh api -X POST "repos/Gameaday/Ephyra/issues/$ISSUE/comments" -f body="$(cat summary.md)"
          echo "Posted."
