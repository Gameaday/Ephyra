# Throwaway artifact-triage workflow v2 (temp branch, deleted after use).
# Downloads the test-report artifact from the failed round-2 run and comments
# diagnostics on PR #359. Runs NO tests and NO gradle build.
name: Triage 359 round 2 v2
on:
  push:
    branches: [triage/359-r2]
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Extract diagnostics from round-2 test report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$(mktemp -d)"
          {
            echo "### Round-2 triage v2 (run 43130134829 artifact 13904992018)"
            echo
            echo "### Download + inventory"
            gh api repos/Gameaday/Ephyra/actions/artifacts/13904992018/zip > artifact.zip
            echo "artifact.zip bytes: $(wc -c < artifact.zip)"
            unzip -o -q artifact.zip
            echo "xml files: $(find . -name '*.xml' | wc -l)"
            echo "html files: $(find . -name '*.html' | wc -l)"
            echo "top-level dirs:"
            find . -maxdepth 3 -type d | head -40
            echo
            echo "### Testsuites with failures>0 or errors>0"
            grep -rho '<testsuite[^>]*' --include='*.xml' . | grep -E 'failures="[1-9]|errors="[1-9]' | head -40
            echo
            echo "### Testcases with <failure> (preceding testcase line)"
            grep -rB1 '<failure' --include='*.xml' . | grep 'testcase ' | head -60
            echo
            echo "### Testcases with <error> (preceding testcase line)"
            grep -rB1 '<error' --include='*.xml' . | grep 'testcase ' | head -60
            echo
            echo "### Failure/error messages (truncated)"
            grep -rhoE '<(failure|error) message="[^"]*"' --include='*.xml' . | head -40
            echo
            echo "### Failure/error type attributes"
            grep -rhoE '<(failure|error)[^>]*type="[^"]*"' --include='*.xml' . | head -40
          } > diag.md 2>&1
          gh pr comment 359 --repo Gameaday/Ephyra --body-file diag.md
