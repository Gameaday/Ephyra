# Throwaway artifact-triage workflow (temp branch, deleted after use).
# Downloads the test-report artifact from the failed round-2 run and comments
# the failing test names on PR #359. Runs NO tests and NO gradle build.
name: Triage 359 round 2
on:
  push:
    branches: [triage/359-r2]
permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Extract failing tests from round-2 test report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$(mktemp -d)"
          gh api repos/Gameaday/Ephyra/actions/artifacts/13904992018/zip > artifact.zip || echo "artifact download failed"
          unzip -o -q artifact.zip || echo "unzip failed"
          {
            echo "### Round-2 failing tests (from run 43130134829 test-report artifact)"
            echo
            echo "### Testcases with <failure> (preceding testcase line)"
            grep -rB1 '<failure' --include='*.xml' . | grep 'testcase ' | head -60 || true
            echo
            echo "### Failure messages (truncated)"
            grep -rho '<failure message="[^"]*"' --include='*.xml' . | head -40 || true
          } > diag.md 2>&1
          wc -c diag.md >> diag2.txt 2>&1 || true
          gh pr comment 359 --repo Gameaday/Ephyra --body-file diag.md
