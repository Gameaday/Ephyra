# Throwaway compile-triage workflow v3 (temp branch, deleted after use).
# Checks out the PR branch and compiles all main + unit-test sources (NO tests run)
# to capture the real compile error that red-round-2 hid.
name: Triage 359 round 2 v3
on:
  push:
    branches: [triage/359-r2]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  triage:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/strict-udf-gate

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c

      - name: Compile main + unit-test sources (no test execution)
        id: compile
        continue-on-error: true
        run: |
          ./gradlew testClasses --continue > compile.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Round-2 triage v3 - compile reproduction (fix/strict-udf-gate @ 4cc6c55)"
            echo
            echo "compile exit code: ${{ steps.compile.outputs.exit }}"
            echo
            echo '```'
            grep -n 'FAILURE' compile.log | head -20
            grep -nE 'error:|^e: ' compile.log | head -60
            echo
            tail -60 compile.log
            echo '```'
          } > diag.md 2>&1
          gh pr comment 359 --repo Gameaday/Ephyra --body-file diag.md
