name: Diagnose 357
on:
  pull_request:
    paths:
      - '**'

concurrency:
  group: diagnose-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: 'ubuntu-24.04'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Capture spotlessCheck failures
        run: ./gradlew spotlessCheck --parallel --no-daemon > spotless-check.log 2>&1 || true

      - name: Apply formatting
        run: ./gradlew spotlessApply --parallel --no-daemon || true

      - name: Post findings as PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff > diag.diff
          {
            echo "### Diagnose: spotless findings (run ${{ github.run_id }})"
            echo '<details><summary>spotlessCheck output tail</summary>'
            echo '```'
            tail -c 8000 spotless-check.log
            echo '```'
            echo '</details>'
            echo '<details><summary>spotlessApply diff</summary>'
            echo '```diff'
            head -c 40000 diag.diff
            echo '```'
            echo '</details>'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
