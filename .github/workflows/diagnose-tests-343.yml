name: Diagnose test failures (343, throwaway)
on:
  push:
    branches: [fix/reader-page-immutable-resource]
  workflow_dispatch:

concurrency:
  group: diagnose-343
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
          gradle-home-cache-cleanup: true

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --continue > /tmp/test.log 2>&1 || true

      - name: Extract failures and post to PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FENCE='```'
          {
            echo "Diagnose run on $(git rev-parse HEAD)."
            echo "$FENCE"
            find . -path '*/build/test-results/testDebugUnitTest/TEST-*.xml' 2>/dev/null | while read -r f; do
              if grep -q '<failure' "$f"; then
                echo "=== $f"
                grep -o 'testcase name="[^"]*" classname="[^"]*"' "$f" | head -30 || true
                grep -o '<failure[^>]*message="[^"]*"' "$f" | head -10 || true
              fi
            done
            echo "--- first FAILED/FAILURE lines from gradle log ---"
            grep -nE 'FAILED$|FAILURE: ' /tmp/test.log | head -40 || true
            echo "$FENCE"
          } > /tmp/excerpt.txt
          gh pr comment 343 --body-file /tmp/excerpt.txt --repo Gameaday/Ephyra
