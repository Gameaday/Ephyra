name: Nightly Build

# Run on schedule at 2 AM UTC, not on every push
# This avoids race conditions with the main build workflow
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: read

jobs:
  build:
    name: Build & Publish Nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build app
        run: ./gradlew assembleNightly -Penable-updater -PversionCode=${{ github.run_number }}
        env:
          EPHYRA_NIGHTLY_STORE_PASSWORD: ${{ secrets.EPHYRA_NIGHTLY_STORE_PASSWORD }}
          EPHYRA_NIGHTLY_KEY_PASSWORD: ${{ secrets.EPHYRA_NIGHTLY_KEY_PASSWORD }}

      - name: Sign APK
        if: ${{ env.SIGNING_KEY != '' }}
        uses: r0adkll/sign-android-release@d5f8436b702872ad5cdb1e6e4d5c8b983d25a997
        with:
          releaseDirectory: app/build/outputs/apk/nightly
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '36.0.0'
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Sign APK with debug keystore (fallback)
        if: ${{ env.SIGNING_KEY == '' }}
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore /tmp/ephyra-nightly.keystore \
            -storepass android \
            -alias nightlykey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=Ephyra,O=Ephyra,C=US"

          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          if [ ! -f "$APKSIGNER" ]; then
            APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name "apksigner" -type f 2>/dev/null | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          fi
          if [ -z "$APKSIGNER" ] || [ ! -f "$APKSIGNER" ]; then
            echo "::error::apksigner not found. Configure SIGNING_KEY for production signing."
            exit 1
          fi

          for apk in app/build/outputs/apk/nightly/*-unsigned.apk; do
            [ -f "$apk" ] || continue
            signed="${apk%-unsigned.apk}-unsigned-signed.apk"
            "$APKSIGNER" sign \
              --ks /tmp/ephyra-nightly.keystore \
              --ks-pass pass:android \
              --key-pass pass:android \
              --ks-key-alias nightlykey \
              --out "$signed" \
              "$apk"
          done
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Rename APKs
        run: |
          set -e
          cd app/build/outputs/apk/nightly
          SHORT_SHA="${GITHUB_SHA::7}"
          if ls *-signed.apk 2>/dev/null | grep -q .; then
            for apk in *.apk; do
              [[ "$apk" == *-signed.apk ]] || rm -f "$apk"
            done
          fi
          for apk in *.apk; do
            [[ -f "$apk" ]] || continue
            base=$(echo "$apk" | sed -E 's/-nightly.*\.apk$//')
            mv "$apk" "${base}-nightly-${SHORT_SHA}.apk"
          done

      - name: Delete existing nightly release
        run: gh release delete nightly --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create nightly release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            Automated nightly build from commit ${{ github.sha }}.

            Built from branch `${{ github.ref_name }}` at ${{ github.event.head_commit.timestamp }}.
          files: app/build/outputs/apk/nightly/*.apk
          prerelease: true
          make_latest: false
