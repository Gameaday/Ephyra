name: Diagnose build 343
on:
  push:
    branches:
      - fix/reader-page-immutable-resource

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    name: gradle failure excerpt
    runs-on: 'ubuntu-24.04'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
          gradle-home-cache-cleanup: true

      - name: Run unit tests
        run: |
          set +e
          ./gradlew testDebugUnitTest --build-cache --parallel --no-daemon > /tmp/build.log 2>&1
          echo "gradle_exit=$?" >> /tmp/build.log
          exit 0

      - name: Post failure excerpt to PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FENCE='```'
          {
            echo 'gradle failure excerpt (auto-posted):'
            echo "$FENCE"
            grep -E '^e: |FAILED|FAILURE|What went wrong|gradle_exit=' /tmp/build.log | head -160
            echo '--- recorded test failures ---'
            for f in $(find . -path '*/build/test-results/testDebugUnitTest/TEST-*.xml' 2>/dev/null); do
              if grep -q '<failure' "$f"; then
                echo "FILE: $f"
                grep -o '<failure[^>]*message="[^"]*"' "$f" | head -6
                grep -o 'testcase name="[^"]*"' "$f" | head -8
              fi
            done
            echo "$FENCE"
          } > /tmp/comment.md
          gh pr comment 343 --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
