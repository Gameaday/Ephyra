name: CI

# Runs on every pull request, including documentation-only changes.
#
# This previously excluded `**.md` and `docs/**`, which meant a markdown-only PR executed no
# verification at all. That is indefensible in a program that treats documentation as a
# deliverable: the documentation gate would have been structurally unfalsifiable, because the only
# way to falsify it is a PR that changes nothing but the thing it checks. The exclusion bought a
# little CI time and cost the guarantee that the repository's own records are true.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-check:
    name: PR Validation
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
          gradle-home-cache-cleanup: true

      - name: Run PR Verification
        run: ./gradlew testDebugUnitTest ktlintCheck --continue
