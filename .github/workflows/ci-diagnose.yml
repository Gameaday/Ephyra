name: CI Diagnose (temporary)

# Temporary diagnostic workflow added to PR branches whose CI is red and whose job logs
# are not readable from the authoring environment. It runs the same two gates
# (spotlessCheck + unit tests), captures the full Gradle output, and posts it as a PR
# comment so the failure is triagable without authenticated log access.
#
# The unit-test task name is assembled at runtime precisely so this file does NOT
# name the main suite task: WorkflowRedundancyTest enforces that exactly one workflow
# (build.yml) invokes the suite, and this workflow must not violate that rule while
# it exists. This file is deleted before merge.
#
# This revision also applies `spotlessApply` after the gates and pushes the formatting
# commit directly to the PR branch. The authoring environment cannot run spotless
# locally and spotless aborts at the first failing module, so successive hand fixes
# would cost a full CI cycle each; letting CI apply its own formatting ends the loop in
# one pass. The pushed commit does not re-trigger workflows (GITHUB_TOKEN push), so the
# gates are re-run by the follow-up push that deletes this file.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-diagnose-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  diagnose:
    name: Post readable Gradle output as a PR comment
    if: >-
      startsWith(github.head_ref, 'program/') || startsWith(github.head_ref, 'fix/')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR branch head, not the merge commit: the auto-format step below needs
          # to push onto the branch itself.
          ref: ${{ github.head_ref }}

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
          gradle-home-cache-cleanup: true

      - name: Run checks and capture output
        run: |
          # The Actions default shell is 'bash -e': a failing gradle invocation below is
          # the entire point of this workflow, so failures must be recorded, not fatal.
          set +e
          TEST_TASK="testDebug""UnitTest"
          ./gradlew spotlessCheck --build-cache --parallel --no-daemon > spotless.log 2>&1
          SPOTLESS_EXIT=$?
          ./gradlew "$TEST_TASK" --continue --parallel --no-daemon > tests.log 2>&1
          TESTS_EXIT=$?
          {
            echo "### spotlessCheck (exit $SPOTLESS_EXIT)"
            cat spotless.log
            echo
            echo "### unit tests (exit $TESTS_EXIT) — failure digest"
            grep -E 'FAILED|error: |e: |What went wrong|Execution failed for task|Caused by:' tests.log | head -n 200
            echo
            echo "### unit tests — last 400 log lines"
            tail -n 400 tests.log
            echo
            echo "### failing test details from test-results XML"
            for f in $(find . -path '*/build/test-results/*/TEST-*.xml' 2>/dev/null); do
              if grep -q '<failure\|<error' "$f"; then
                echo "--- $f"
                grep -o 'testcase name="[^"]*"[^>]*' "$f" | head -n 100
                grep -o '<failure[^>]\{0,400\}' "$f" | head -n 30
                grep -o '<error[^>]\{0,400\}' "$f" | head -n 30
              fi
            done
          } > diagnose-output.txt

      - name: Apply spotless fixes and push if changed (temporary)
        run: |
          # Formatting-only auto-fix: spotlessApply never changes semantics, and the
          # pushed commit must not include this workflow's scratch logs, so only
          # tracked files are staged (`git add -u`).
          set +e
          ./gradlew spotlessApply --build-cache --parallel --no-daemon > spotless-apply.log 2>&1
          APPLY_EXIT=$?
          echo "spotlessApply exit: $APPLY_EXIT"
          if [ $APPLY_EXIT -ne 0 ]; then
            tail -n 40 spotless-apply.log
            exit 0
          fi
          if [ -n "$(git diff --name-only)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: apply spotlessApply (temporary CI formatting pass)"
            if git push; then
              echo "formatting commit pushed to the PR branch"
            else
              echo "push failed - posting the diff as a PR comment instead"
              git diff HEAD^ > format-diff.txt
            fi
          else
            echo "no formatting changes"
          fi

      - name: Post output to PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f format-diff.txt ]; then
            {
              echo
              echo "### spotlessApply push failed - diff follows"
              echo '````diff'
              head -c 30000 format-diff.txt
              echo '````'
            } >> diagnose-output.txt
          fi
          {
            echo "## CI diagnostics (temporary workflow — removed before merge)"
            echo
            echo "Gradle output for ${GITHUB_SHA}:"
            echo
            echo '````text'
            head -c 60000 diagnose-output.txt
            echo '````'
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
