name: CI Diagnose (temporary)

# Temporary diagnostic workflow for PR #315: the Quality Checks job is failing fast and
# its logs are not readable from the authoring environment. This runs the same quality
# steps (spotlessCheck + the architecture greps), posts the captured output as a PR
# comment, and applies spotlessApply + pushes the formatting commit if spotless is the
# failure. No test-suite invocation lives here — the Build & Test App job owns that.
# This file is deleted before merge.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-diagnose-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  diagnose:
    name: Post readable quality-gate output as a PR comment
    if: >-
      startsWith(github.head_ref, 'fix/') || startsWith(github.head_ref, 'program/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
          gradle-home-cache-cleanup: true

      - name: Run quality gates and capture output
        run: |
          set +e
          ./gradlew spotlessCheck --build-cache --parallel --no-daemon > spotless.log 2>&1
          SPOTLESS_EXIT=$?
          G1=$(grep -rn --include="*.kt" "^\s*import android\." core/domain/src domain/src 2>/dev/null || true)
          G2=$(grep -rHn --include="*.kt" --exclude-dir="uy" "Injekt\.get(" . || true)
          G3=$(grep -rn --include="*.kt" "^\s*import ephyra\.data\." core/domain/src 2>/dev/null || true)
          G4=$(grep -rn --include="*.kt" "^\s*import ephyra\.data\." feature/*/src/main 2>/dev/null || true)
          {
            echo "### spotlessCheck (exit $SPOTLESS_EXIT)"
            cat spotless.log
            echo
            echo "### architecture greps (empty = pass)"
            echo "android.* in domain: [$G1]"
            echo "Injekt.get(): [$G2]"
            echo "ephyra.data.* in core:domain: [$G3]"
            echo "ephyra.data.* in features: [$G4]"
          } > diagnose-output.txt

      - name: Apply spotless fixes and push if changed (temporary)
        run: |
          set +e
          ./gradlew spotlessApply --build-cache --parallel --no-daemon > spotless-apply.log 2>&1
          APPLY_EXIT=$?
          echo "spotlessApply exit: $APPLY_EXIT"
          if [ $APPLY_EXIT -ne 0 ]; then
            tail -n 40 spotless-apply.log
            exit 0
          fi
          if [ -n "$(git diff --name-only)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: apply spotlessApply (temporary CI formatting pass)"
            git push || echo "push failed"
          else
            echo "no formatting changes"
          fi

      - name: Post output to PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## CI diagnostics (temporary workflow — removed before merge)"
            echo
            echo "Quality-gate output for ${GITHUB_SHA}:"
            echo
            echo '````text'
            head -c 60000 diagnose-output.txt
            echo '````'
          } > comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
