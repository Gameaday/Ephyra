name: CI Diagnose (temporary)
on:
  pull_request:
    branches:
      - program/15-a2-reader-session-wiring

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-diagnose-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose Build and Test failure
    runs-on: 'ubuntu-24.04'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: "317"
      DIAG_TARGETS: ":feature:reader:testDebugUnitTest :app:testDebugUnitTest"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        cache-read-only: true
        gradle-home-cache-cleanup: true

      - name: Run targeted unit suites
        id: suite
        run: |
          set +e
          ./gradlew $DIAG_TARGETS --stacktrace > gradle-output.txt 2>&1
          echo "gradle_exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build diagnostics comment
        if: always()
        run: |
          {
            echo "## CI diagnostics (temporary workflow — removed before merge)"
            echo
            echo "Targeted suites for ${GITHUB_SHA}:"
            echo
            echo '````text'
            echo "### gradle $DIAG_TARGETS (exit ${{ steps.suite.outputs.gradle_exit }})"
            echo "--- error and failure lines ---"
            grep -E "^e: |error: |FAILED|FAILURE|What went wrong" gradle-output.txt | head -120 || true
            echo "--- output tail ---"
            tail -150 gradle-output.txt
            echo '````'
            echo
            echo "--- failing tests from JUnit XML results ---"
            echo '````text'
            found=0
            for f in $(find . -path '*/build/test-results/testDebugUnitTest/TEST-*.xml' 2>/dev/null); do
              if grep -q '<failure' "$f"; then
                found=1
                echo "## $(echo "$f" | sed 's#^\./##')"
                grep -o 'testcase name="[^"]*"' "$f" | head -30 || true
                echo "--- failure messages ---"
                grep -o '<failure[^>]*message="[^"]*"' "$f" | head -10 || true
                echo "--- failure stack traces ---"
                grep -o '<failure[^>]*>[^<]*</failure>' "$f" | head -3 \
                  | sed 's/&#10;/\n/g; s/&#9;/\t/g' | head -120 || true
                echo "--- system-err ---"
                grep -o '<system-err>[^<]*</system-err>' "$f" \
                  | sed 's/&#10;/\n/g; s/&#9;/\t/g' | head -50 || true
              fi
            done
            if [ "$found" = "0" ]; then
              echo "(no <failure> elements found in the XML results of these modules)"
            fi
            echo '````'
          } > comment-body.md

      - name: Trim comment body
        if: always()
        run: |
          if [ "$(wc -c < comment-body.md)" -gt 60000 ]; then
            head -c 58000 comment-body.md > comment-trimmed.md
            printf '\n\n(comment trimmed at 58000 bytes)\n' >> comment-trimmed.md
            mv comment-trimmed.md comment-body.md
          fi

      - name: Post diagnostics comment
        if: always()
        run: |
          jq -n --rawfile body comment-body.md '{body: $body}' > payload.json
          curl -sS -f -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Gameaday/Ephyra/issues/$PR_NUMBER/comments" \
            -d @payload.json
