name: CI Diagnose (temporary)
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-diagnose-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    name: Post readable Gradle output as a PR comment
    runs-on: 'ubuntu-24.04'
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
          gradle-home-cache-cleanup: true

      - name: Restore google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Run spotlessCheck
        id: spotless
        continue-on-error: true
        run: |
          set +e
          ./gradlew spotlessCheck --build-cache --parallel --no-daemon > /tmp/spotless.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run unit tests
        id: tests
        continue-on-error: true
        run: |
          set +e
          ./gradlew testDebugUnitTest > /tmp/tests.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Compile connected instrumentation APK
        id: atest
        continue-on-error: true
        run: |
          set +e
          ./gradlew :app:assembleDebugAndroidTest --no-daemon > /tmp/atest.log 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post readable Gradle output as a PR comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "## CI diagnostics (temporary workflow — removed before merge)"
            echo ""
            echo "Gradle output for ${{ github.event.pull_request.head.sha }}:"
            echo ""
            echo '````'text
            echo "### spotlessCheck (exit ${{ steps.spotless.outputs.exit }})"
            tail -n 60 /tmp/spotless.log
            echo ""
            echo "### unit tests (exit ${{ steps.tests.outputs.exit }}) — failure digest"
            grep -E "^e: |FAILED|FAILURE|> Task.*FAILED" /tmp/tests.log | head -n 80 || true
            echo ""
            echo "### unit tests — last 400 log lines"
            tail -n 400 /tmp/tests.log
            echo ""
            echo "### androidTest APK (exit ${{ steps.atest.outputs.exit }}) — last 200 log lines"
            tail -n 200 /tmp/atest.log
            echo '````'
            echo ""
            echo "### failing test details from test-results XML"
            echo '````'
            for f in $(find . -path '*/build/test-results/testDebugUnitTest/TEST-*.xml' 2>/dev/null); do
              if grep -q '<failure' "$f"; then
                echo "== $f"
                grep -o 'testcase name="[^"]*" classname="[^"]*"' "$f" | head -50 || true
                grep -o '<failure[^>]*message="[^"]*"' "$f" | head -20 || true
              fi
            done
            echo '````'
          } > /tmp/comment.md
          gh pr comment "$PR" --body-file /tmp/comment.md
