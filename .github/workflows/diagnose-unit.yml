name: Diagnose unit suite (throwaway)
on:
  pull_request:
    paths:
      - '**'

concurrency:
  group: diagnose-unit-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    name: Diagnose unit suite (push-like config)
    runs-on: 'ubuntu-24.04'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
          gradle-home-cache-cleanup: true
      # Push runs execute assembleRelease immediately before the suite; PR runs skip it.
      # Reproducing the push configuration is the point: the race this branch fixes was
      # load-dependent and only surfaced after assembleRelease had run on the runner.
      - name: Build app (push-like configuration)
        run: ./gradlew assembleRelease -Penable-updater
      - name: Run the unit suite three times
        run: |
          set -uo pipefail
          RED=0
          for i in 1 2 3; do
            echo "=== SUITE RUN $i ==="
            if ./gradlew testDebugUnitTest --rerun --continue; then
              echo GREEN > "/tmp/status$i"
              echo "=== RUN $i GREEN ==="
            else
              RED=1
              echo RED > "/tmp/status$i"
              echo "=== RUN $i RED ==="
            fi
            rm -rf "/tmp/run$i"
            for f in $(find . -path '*/build/test-results/testDebugUnitTest/TEST-*.xml'); do
              rel=$(echo "$f" | sed 's#^\./##')
              mkdir -p "/tmp/run$i/$(dirname "$rel")"
              cp "$f" "/tmp/run$i/$rel"
            done
          done
          exit $RED
      - name: Post results to the pull request
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          FENCE=$(printf '\x60\x60\x60')
          {
            echo "## Diagnose: unit suite in push-like configuration (throwaway workflow)"
            echo ""
            echo "Head: $GITHUB_SHA — assembleRelease ran before the suite, exactly as the push runner does, then the full unit suite ran three times."
            echo ""
            for i in 1 2 3; do
              S=$(cat "/tmp/status$i" 2>/dev/null || echo UNKNOWN)
              echo "### Run $i: $S"
              if [ "$(grep -rl --include='TEST-*.xml' '<failure' "/tmp/run$i" 2>/dev/null | wc -l)" = "0" ]; then
                echo "No failing testcases this run."
              else
                echo "Failing testcases:"
                echo "$FENCE"
                for f in $(grep -rl --include='TEST-*.xml' '<failure' "/tmp/run$i" 2>/dev/null); do
                  echo "FILE: $f"
                  grep -B1 '<failure' "$f" | cut -c1-400
                  echo ""
                done
                echo "$FENCE"
              fi
              echo ""
            done
            echo "WorkflowRedundancyTest, if listed above, is the known self-inflicted red: this throwaway workflow is a second suite-invoking workflow and is deleted before the gate round."
          } > /tmp/diagnose-report.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/diagnose-report.md
