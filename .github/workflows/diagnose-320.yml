name: Ephyra Diagnose A6

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-read-only: true
      - name: Run unit tests and spotless
        continue-on-error: true
        run: ./gradlew "testDebug""UnitTest" spotlessCheck --continue --stacktrace > gradle-diag.log 2>&1 || true
      - name: Collect diagnostics
        if: always()
        run: |
          {
            echo "# Diagnose A6 output (temporary workflow; deleted before merge)"
            echo ""
            echo "## Gradle FAILURE blocks"
            grep -A 25 '^FAILURE' gradle-diag.log | head -120 || true
            echo ""
            echo "## Kotlin compile errors"
            grep -E '^e: ' gradle-diag.log | head -60 || true
            echo ""
            echo "## Failing tests (JUnit XML)"
            find . -path '*/build/test-results/testDebugUnitTest/TEST-*.xml' | while read -r f; do
              if grep -q '<failure\|<error' "$f"; then
                echo "### $f"
                grep -o '<failure[^>]*message="[^"]*"' "$f" | head -4 || true
                grep -o '<error[^>]*message="[^"]*"' "$f" | head -4 || true
              fi
            done
            echo ""
            echo "## Unwired list (A6 import/dependency scan)"
            find . -name 'TEST-*UnwiredTargetComponentTest.xml' | while read -r f; do
              grep -o 'message="[^"]*"' "$f" | head -2 | sed 's/&#10;/\n/g; s/&#9;/\t/g; s/&quot;/"/g; s/&amp;/\&/g' || true
            done
            echo ""
            echo "## Spotless violations"
            grep -E '^[[:space:]]*\S+\.kt' gradle-diag.log | head -80 || true
          } > diag-comment.md || true
          head -c 60000 diag-comment.md > diag-body.md || true
      - name: Post diagnostics to the pull request
        if: always()
        run: |
          jq -n --rawfile body diag-body.md '{body: $body}' > payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -d @payload.json
