name: Diagnose spotless 342
on:
  push:
    branches:
      - fix/component-motion-crossfade-sweep

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: diagnose-spotless-342
  cancel-in-progress: true

jobs:
  diagnose:
    name: Diagnose format violations
    runs-on: 'ubuntu-24.04'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
          gradle-home-cache-cleanup: true

      - name: Apply spotless and capture the canonical diff
        run: |
          ./gradlew spotlessApply --build-cache --parallel --no-daemon > /tmp/spotless.log 2>&1 || true
          git --no-pager diff > /tmp/diff.txt
          echo "diff bytes: $(wc -c < /tmp/diff.txt)"

      - name: Post findings to the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FENCE="$(printf '%s%s%s' '`' '`' '`')"
          if [ -s /tmp/diff.txt ]; then
            {
              echo '# CI diagnose: spotlessApply diff (PR 342 round-1 format failure)'
              echo ''
              echo 'Auto-generated by the throwaway diagnose workflow. This is exactly what'
              echo 'spotless/ktlint wants changed; the fix will land as a reviewed commit.'
              echo ''
              echo "$FENCE"'diff'
              cat /tmp/diff.txt
              echo "$FENCE"
            } > /tmp/body.md
            gh pr comment 342 --body-file /tmp/body.md
          else
            {
              echo '# CI diagnose: spotlessApply produced no diff (PR 342 round-1 format failure)'
              echo ''
              echo 'The tree is already spotless-canonical per spotlessApply; the spotless'
              echo 'check failure must be environmental or engine-side. Spotless log tail:'
              echo ''
              echo "$FENCE"
              tail -n 80 /tmp/spotless.log
              echo "$FENCE"
            } > /tmp/body2.md
            gh pr comment 342 --body-file /tmp/body2.md
          fi
