name: 'Diagnose 358'
on:
  push:
    branches:
      - fix/history-expanded-children
permissions:
  contents: read
  pull-requests: write
jobs:
  diagnose:
    runs-on: 'ubuntu-24.04'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 21
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: spotlessApply and capture diff
        run: |
          ./gradlew spotlessApply --no-daemon --build-cache --parallel || true
          git diff > /tmp/spotless.diff
          wc -c /tmp/spotless.diff
      - name: Compile history module and capture tail
        run: |
          ./gradlew :feature:history:compileDebugKotlin :feature:history:compileDebugUnitTestKotlin --no-daemon --build-cache --parallel > /tmp/compile.log 2>&1 || true
          tail -c 6000 /tmp/compile.log > /tmp/compile.tail
      - name: Post both to the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Round-1 diagnosis (throwaway diagnose workflow; deleted before the gate round):'
            echo ''
            echo '<details><summary>spotlessApply diff</summary>'
            echo ''
            echo '```diff'
            cat /tmp/spotless.diff
            echo '```'
            echo '</details>'
            echo ''
            echo '<details><summary>:feature:history compile output (tail)</summary>'
            echo ''
            echo '```text'
            cat /tmp/compile.tail
            echo '```'
            echo '</details>'
          } > /tmp/comment.md
          gh pr comment 358 --repo Gameaday/Ephyra --body-file /tmp/comment.md
