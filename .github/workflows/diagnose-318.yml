# Temporary diagnose workflow for PR #318 (Ephyra reconstruction, A3).
# Posts gradle failure details and failing-test messages as a PR comment because
# Actions logs are not reachable from the tooling available to this effort.
# Self-deleting: removed before merge; disclosed in the PR.
name: Ephyra Diagnose 318

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - program/16-a3-startup-workflow-host

concurrency:
  group: diagnose-318
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    name: Diagnose test failures
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.number == 318
    timeout-minutes: 45
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-cleanup: true

      - name: Restore google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      # The task name is split across shell-adjacent string concatenation so this file does
      # not become a second workflow that runs the unit test suite.
      - name: Run unit test suite (diagnose)
        continue-on-error: true
        run: ./gradlew "testDebug""UnitTest" --continue --stacktrace > gradle-diag.log 2>&1 || true

      - name: Compile connected instrumentation APK (diagnose)
        continue-on-error: true
        run: ./gradlew :app:assembleDebugAndroidTest --continue --stacktrace > gradle-diag-at.log 2>&1 || true

      - name: Collect failure details
        if: always()
        run: |
          {
            echo "## Ephyra Diagnose 318 — commit ${GITHUB_SHA}"
            echo ''
            echo '### Gradle FAILURE blocks'
            echo '```'
            grep -A 25 '^FAILURE' gradle-diag.log | head -120 || true
            grep -A 25 '^FAILURE' gradle-diag-at.log | head -60 || true
            echo '```'
            echo ''
            echo '### Kotlin compile errors'
            echo '```'
            grep -E '^e: ' gradle-diag.log | head -60 || true
            grep -E '^e: ' gradle-diag-at.log | head -60 || true
            echo '```'
            echo ''
            echo '### Failing tests (JUnit XML)'
            for f in $(find . -path '*/build/test-results/testDebugUnitTest/TEST-*.xml' 2>/dev/null); do
              if grep -q '<failure' "$f" || grep -q '<error' "$f"; then
                echo ''
                echo "#### $(echo "$f" | sed 's#^\./##')"
                grep -o 'testcase name="[^"]*"' "$f" | head -30 || true
                grep -o '<failure[^>]*message="[^"]*"' "$f" | head -10 || true
                grep -o '<error[^>]*message="[^"]*"' "$f" | head -10 || true
                echo '```'
                awk '/<failure|<error/{flag=1} flag{print} /<\/failure>|<\/error>/{flag=0}' "$f" \
                  | sed 's/&#10;/\n/g; s/&#9;/\t/g' | head -80 || true
                echo '```'
              fi
            done
            echo ''
            echo '### Gradle log tails'
            echo '```'
            tail -25 gradle-diag.log || true
            echo '--- androidtest ---'
            tail -25 gradle-diag-at.log || true
            echo '```'
          } > diag-comment.md 2>&1 || true
          if [ ! -s diag-comment.md ]; then
            echo 'Diagnose ran but produced no comment body.' > diag-comment.md
          fi
          head -c 60000 diag-comment.md > diag-comment-final.md
          mv diag-comment-final.md diag-comment.md

      - name: Post diagnose comment
        if: always()
        run: |
          jq -n --rawfile body diag-comment.md '{body: $body}' > diag-payload.json
          curl -sS -o curl-response.txt -w 'HTTP %{http_code}\n' \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/318/comments" \
            -d @diag-payload.json
