name: Build & Test
on:
  pull_request:
    # Runs on every pull request, including documentation-only changes.
    #
    # This previously excluded `**.md`, which meant a markdown-only PR executed no
    # verification at all — indefensible in a program that treats documentation as a
    # deliverable, because the only way to falsify a documentation gate is a PR that changes
    # nothing but the thing it checks. A duplicate `ci.yml` existed to cover that gap; it also
    # re-ran the full test suite and a `ktlintCheck` alias that `spotlessCheck` already
    # covers, so every PR paid for the suite twice. `ci.yml` is deleted and this workflow is
    # the single gate. `WorkflowRedundancyTest` keeps it that way.
    paths:
      - '**'
      - '!i18n/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n/src/commonMain/moko-resources/base/plurals.xml'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast feedback: lint + architecture checks (runs in ~2 min)
  quality:
    name: Quality Checks
    runs-on: 'ubuntu-24.04'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-cleanup: true

      - name: Check code format
        run: ./gradlew spotlessCheck --build-cache --parallel --no-daemon

      - name: Architecture fitness – no android.* imports in domain modules
        run: |
          VIOLATIONS=$(grep -rn --include="*.kt" "^\s*import android\." \
            core/domain/src domain/src 2>/dev/null || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::android.* imports found in domain modules (architectural violation):"
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: Architecture fitness – no Injekt.get()
        run: |
          VIOLATIONS=$(grep -rHn --include="*.kt" --exclude-dir="uy" "Injekt\.get(" . || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Injekt.get() found in codebase (use Hilt constructor injection instead):"
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: Architecture fitness – no ephyra.data.* imports in core domain module
        run: |
          VIOLATIONS=$(grep -rn --include="*.kt" "^\s*import ephyra\.data\." \
            core/domain/src 2>/dev/null || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::ephyra.data.* imports found in :core:domain (architectural violation):"
            echo "$VIOLATIONS"
            exit 1
          fi

      # Structural, not a count. The previous form compared a grep count against `BASELINE=0`
      # and told the author to "lower BASELINE in build.yml" — a gate satisfiable by editing a
      # number, which is the metric-as-measure antipattern recorded in BUILD_HEALTH.md. It also
      # failed on a *test* file, which is not a layering violation at all.
      #
      # Scoped to `src/main` deliberately: only production sources carry a layering obligation. A
      # test may reach into `core:data` to exercise behaviour owned there, and that is legitimate.
      #
      # The unresolved question this rule deliberately does NOT hide: `feature/reader` declares
      # `implementation(projects.core.data)`, so features *can* depend on data. Whether they
      # should is a data-ownership decision belonging to the DATA-001I cutover gate, not to a
      # grep. See B-027.
      - name: Architecture fitness – no ephyra.data.* imports in feature production sources
        run: |
          VIOLATIONS=$(grep -rn --include="*.kt" "^\s*import ephyra\.data\." \
            feature/*/src/main 2>/dev/null || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::ephyra.data.* imports found in feature production sources (architectural violation):"
            echo "$VIOLATIONS"
            echo "::error::A feature must reach data through a contract, not by importing it directly."
            exit 1
          fi
      # Regression guard for the Mangabat/extension-zstd crash (CHANGELOG: extensions
      # resolve okhttp3.zstd.* against the host classpath, so the host must bundle a
      # matching okhttp-zstd). Pin okhttp-zstd to okhttp_version in the version catalog;
      # this step fails the build if they ever drift apart.
      - name: Dependency fitness – okhttp-zstd pinned to okhttp_version
        run: |
          CATALOG="gradle/libs.versions.toml"
          HTTP_VERSION=$(grep -E '^okhttp_version\s*=' "$CATALOG" | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          ZSTD_LINE=$(grep -E '^okhttp-zstd\s*=' "$CATALOG" | head -1)
          if ! echo "$ZSTD_LINE" | grep -q 'version.ref\s*=\s*"okhttp_version"'; then
            echo "::error::okhttp-zstd is not pinned to okhttp_version in $CATALOG."
            echo "::error::Found:  $ZSTD_LINE"
            echo "::error::Extensions resolve okhttp3.zstd.* against the host classpath (see CHANGELOG.md); the host build MUST keep okhttp-zstd aligned with okhttp_version or modern Mihon/Keiyoushi extensions crash with NoClassDefFoundError."
            exit 1
          fi
          echo "okhttp-zstd pinned to okhttp_version (${HTTP_VERSION}) – extension zstd ABI safe."



      - name: Architecture fitness – all HomeScreen tabs must call signalReady()
        run: |
          TABS=(
            "feature/library/src/main/kotlin/ephyra/feature/library/LibraryScreen.kt"
            "feature/updates/src/main/kotlin/ephyra/feature/updates/UpdatesScreen.kt"
            "feature/history/src/main/kotlin/ephyra/feature/history/HistoryScreen.kt"
            "feature/browse/src/main/kotlin/ephyra/feature/browse/BrowseScreen.kt"
            "feature/more/src/main/kotlin/ephyra/feature/more/MoreScreen.kt"
          )
          MISSING=()
          for tab in "${TABS[@]}"; do
            if [ ! -f "$tab" ]; then
              MISSING+=("MISSING FILE: $tab")
            elif ! grep -q "AppReadySignal" "$tab"; then
              MISSING+=("$tab")
            fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::The following HomeScreen tabs do not reference AppReadySignal / signalReady():"
            for f in "${MISSING[@]}"; do
              echo "::error::  $f"
            done
            echo "::error::Add a LaunchedEffect that calls (context as? AppReadySignal)?.signalReady()"
            echo "::error::when the tab's content has finished loading."
            exit 1
          fi
          echo "All ${#TABS[@]} HomeScreen tabs correctly reference AppReadySignal."

  # Build and test.
  #
  # Deliberately does NOT `needs: quality`. That dependency meant a formatting
  # failure in the lint job marked this job `skipped`, so the entire unit-test
  # suite never ran and no run reported a result. It is not hypothetical: on
  # 579c7ba32 `Quality Checks` failed at `Check code format` and this job was
  # `skipped`, hiding two genuinely failing tests (see B-063/B-064). Lint and
  # tests are independent signals and are allowed to fail independently; a lint
  # failure must never decide whether the tests are executed.
  #
  # The cost is real and accepted: a pull request with a lint failure still spends
  # the runner minutes to compile and run the suite. Paying that is what buys the
  # guarantee that a red test suite is visible rather than inferred.
  build:
    name: Build & Test App
    runs-on: 'ubuntu-24.04'
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Enable build cache for faster builds
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          # Enable Gradle build cache
          gradle-home-cache-cleanup: true

      - name: Restore google-services.json
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      # Lint/architecture checks (spotless + architecture fitness) are a separate,
      # independent job. They are not re-run here: duplicating the gate would make
      # two authorities for the same rule, which is the redundancy `ci.yml` was
      # deleted for.
      - name: Build app
        if: github.event_name != 'pull_request'
        run: |
          FLAGS="-Penable-updater"
          [ -f app/google-services.json ] && FLAGS="$FLAGS -Pinclude-telemetry"
          ./gradlew assembleRelease $FLAGS

      - name: Run unit tests
        id: unit_tests
        run: ./gradlew testDebugUnitTest

      # A red gate that names nothing is worse than no gate: it cannot be triaged without
      # authentication, so the failure gets re-run and re-guessed. This writes the failing tests
      # into the job log itself, so the log is enough to act on.
      - name: Summarise unit test failures
        if: always()
        run: |
          set -euo pipefail
          found=0
          for f in $(find . -path '*/build/test-results/testDebugUnitTest/TEST-*.xml' 2>/dev/null); do
            if grep -q '<failure' "$f"; then
              found=1
              echo "::group::$(echo "$f" | sed 's#^\./##')"
              grep -o 'testcase name="[^"]*" classname="[^"]*"' "$f" | head -50 || true
              grep -o '<failure[^>]*message="[^"]*"' "$f" | head -20 || true
              echo "::endgroup::"
            fi
          done
          if [ "$found" = "0" ]; then
            echo "No <failure> element in any module's test results."
            echo "If this step's job failed, the failure was not an assertion in a recorded test"
            echo "-- most likely a compile error, a Gradle task failure, or a JVM that died."
            echo "Re-run with '--stacktrace' or read the log for the first 'FAILURE:' line."
          fi

      - name: Compile connected instrumentation APK
        run: ./gradlew :app:assembleDebugAndroidTest --no-daemon

      # Was scoped to :app only, so a failure in any of the other 24 modules uploaded nothing at
      # all and the run reported zero artifacts -- which is how a red gate became undiagnosable.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-report-${{ github.sha }}
          if-no-files-found: warn
          # `**` not `*`: a single `*` does not cross a path separator, so this never matched
          # nested modules such as `core/data`.
          path: |
            **/build/reports/tests/testDebugUnitTest
            **/build/test-results/testDebugUnitTest

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm64-v8a-${{ github.sha }}
          path: app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk

      - name: Upload mapping
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release
