name: Connected Instrumentation
on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * 1"  # Weekly at 05:30 UTC
  workflow_call:

concurrency:
  group: connected-instrumentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  connected-smoke:
    name: API 35 Connected Smoke
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-home-cache-cleanup: true

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot API 35 emulator
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          channel: stable
          profile: pixel_6
          force-avd-creation: true
          emulator-options: "-no-snapshot -gpu swiftshader_indirect -no-window -camera-back none"
          emulator-boot-timeout: 600
          script-timeout: 1800
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connected-instrumentation-${{ github.sha }}
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            app/build/outputs/apk/androidTest/debug/
