name: Connected Instrumentation
on:
  workflow_dispatch:
  # Deliberately NOT on push or pull_request.
  #
  # This was broadened to cover both while the emulator provisioned correctly on a
  # developer's machine, and that was wrong. On GitHub's runners the API 35 emulator
  # does not boot -- the job fails at "Boot API 35 emulator" before a single test
  # runs (run #1, 2026-09-27, `Connected Instrumentation` #1 at 238e36c13). The same
  # provisioning failure is why the macrobenchmark workflow has failed all 24 of its
  # scheduled runs (`B-043`).
  #
  # So a push trigger would mark every commit red for a reason unrelated to the
  # code. That is the inert-gate failure mode wearing a new hat: worse than no gate,
  # because it trains everyone to ignore red and then a real failure is invisible too.
  # A gate that cannot run must be labelled unserviceable, not wired to every push.
  #
  # The fix is emulator boot, not the trigger. Until that is resolved this stays on the
  # weekly schedule, and `B-050` carries the blocker.
  schedule:
    - cron: "30 5 * * 1"  # Weekly at 05:30 UTC
  workflow_call:

concurrency:
  group: connected-instrumentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  connected-smoke:
    name: API 35 Connected Smoke
    runs-on: 'ubuntu-24.04'
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-home-cache-cleanup: true

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot API 35 emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          channel: stable
          profile: pixel_6
          force-avd-creation: true
          emulator-options: "-no-snapshot -gpu swiftshader_indirect -no-window -camera-back none"
          emulator-boot-timeout: 600
          script-timeout: 1800
          script: >-
            ./gradlew
            :app:connectedDebugAndroidTest
            :core:data:connectedDebugAndroidTest
            :feature:reader:connectedDebugAndroidTest
            --no-daemon --stacktrace

      # Same principle as the unit-test summariser: a red device gate that names nothing cannot be
      # triaged, and these runs are the only automated proof the E3 claims still hold.
      - name: Summarise instrumentation failures
        if: always()
        run: |
          set -uo pipefail
          found=0
          for f in $(find . -path '*/build/outputs/androidTest-results/connected/*/TEST-*.xml' 2>/dev/null); do
            if grep -q '<failure' "$f"; then
              found=1
              echo "::group::$(echo "$f" | sed 's#^\./##')"
              grep -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" | head -1 || true
              grep -o '<testcase name="[^"]*"[^>]*>' "$f" | head -60 || true
              grep -o '<failure[^>]*message="[^"]*"' "$f" | head -20 || true
              echo "::endgroup::"
            fi
          done
          if [ "$found" = "0" ]; then
            echo "No recorded instrumentation failure in any module."
            echo "If the step above failed, it was an install/boot/compile failure rather than a"
            echo "failing assertion -- check the emulator boot and the Gradle output above."
          fi

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connected-instrumentation-${{ github.sha }}
          if-no-files-found: warn
          # `**` not `*`: a single `*` does not cross a path separator, so `*/build/...` matches
          # `app/build/...` but not `core/data/build/...` -- which is why the first attempt still
          # uploaded nothing when a nested module failed.
          path: |
            **/build/reports/androidTests/connected/
            **/build/outputs/androidTest-results/connected/
            **/build/outputs/apk/androidTest/debug/
