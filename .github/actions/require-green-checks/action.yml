name: Require green checks
description: >-
  Fails unless every check run on a commit is completed and green, and every named required check
  is present with a success conclusion. Polls until the checks complete, so a workflow that starts
  alongside the gate workflow can wait for its verdict instead of re-running the suite. This is
  the REL-001 mechanism: build.yml stays the single authority for whether a change is acceptable,
  and publish paths only read that decision.

inputs:
  sha:
    description: The commit whose check runs are the verdict.
    required: true
  required:
    description: Comma-separated check-run names that must be present and successful.
    required: false
    default: "Quality Checks,Build & Test App"
  timeout-minutes:
    description: How long to wait for the checks to complete before failing.
    required: false
    default: "45"
  poll-seconds:
    description: Interval between polls while checks are still running.
    required: false
    default: "60"
  no-checks-grace-minutes:
    description: How long a commit may report no checks at all before it is failed as never-verified.
    required: false
    default: "10"

runs:
  using: composite
  steps:
    - name: Wait for and require green checks
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_SHA: ${{ inputs.sha }}
        INPUT_REQUIRED: ${{ inputs.required }}
        INPUT_TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        INPUT_POLL_SECONDS: ${{ inputs.poll-seconds }}
        INPUT_NO_CHECKS_GRACE_MINUTES: ${{ inputs.no-checks-grace-minutes }}
      run: |
        set -euo pipefail

        sha="${INPUT_SHA}"
        timeout_minutes="${INPUT_TIMEOUT_MINUTES}"
        poll_seconds="${INPUT_POLL_SECONDS}"
        grace_minutes="${INPUT_NO_CHECKS_GRACE_MINUTES}"
        deadline=$(( $(date +%s) + timeout_minutes * 60 ))
        first_zero_at=""

        while true; do
          now="$(date +%s)"

          # --slurp wraps each --paginate page into one array element, so the read is correct
          # rather than conveniently truncated at the page size.
          pages="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" --paginate --slurp)"

          # The calling run's own jobs are excluded, or the gate would wait on itself: the very
          # job doing the polling is a check run on this same SHA. Actions-backed check runs
          # carry their run id in details_url; a check run from any other source has none.
          rows="$(printf '%s' "${pages}" | jq -r \
            --arg run "$GITHUB_RUN_ID" \
            '.[] | .check_runs[]?
             | select( ((.details_url // "") | test("/actions/runs/" + $run + "/")) | not )
             | [ .name, .status, ( .conclusion // "null" ) ] | @tsv')"

          if [ -n "${rows}" ]; then
            total="$(printf '%s\n' "${rows}" | wc -l)"
            first_zero_at=""
          else
            total=0
          fi
          pending="$(printf '%s\n' "${rows}" | awk -F '\t' '$2 != "completed"')"

          if [ "${total}" -eq 0 ]; then
            # Zero check runs is indistinguishable, at any single instant, from a publish that
            # raced the gate workflow on the same push (the checks are seconds away) and one
            # that no CI has ever built (they will never appear). Both are handled honestly:
            # wait out a bounded grace, then fail as never-verified. Never pass.
            if [ -z "${first_zero_at}" ]; then
              first_zero_at="${now}"
            elif [ $(( now - first_zero_at )) -ge $(( grace_minutes * 60 )) ]; then
              echo "::error::No check runs were reported for ${sha} after ${grace_minutes}m."
              echo "::error::This commit was never built by the gate workflow, so publishing it is exactly what REL-001 exists to prevent."
              echo "::error::Push the commit to main and let the gate workflow verify it, then publish on the verified commit."
              exit 1
            fi
          elif [ -z "${pending}" ]; then
            # Check if all required checks are present
            missing=""
            IFS=',' read -r -a required_names <<< "${INPUT_REQUIRED}"
            for name in "${required_names[@]}"; do
              trimmed="$(printf '%s' "${name}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              if ! printf '%s
' "${rows}" | grep -qF "$(printf '%s	' "${trimmed}")"; then
                missing="${missing}  ${trimmed}
"
              fi
            done
            
            # If required checks are missing, treat as pending and continue waiting
            if [ -n "${missing}" ]; then
              # There are missing required checks, but we saw other checks completed.
              # This likely means the gate workflow hasn't started yet.
              # Continue waiting instead of failing immediately.
              echo "Waiting for required checks to appear on ${sha} (polling every ${poll_seconds}s):"
              printf '%b' "${missing}"
              sleep "${poll_seconds}"
              continue
            fi

            # All required checks are present, check their status
            bad="$(printf '%s
' "${rows}" | awk -F '	' '$3 != "success" && $3 != "skipped" && $3 != "neutral"')"
            if [ -n "${bad}" ]; then
              echo "::error::This publish is gated: ${sha} is not a verified commit."
              echo "::error::Failing check(s):"
              printf '%s
' "${bad}" | sed 's/^/  /'
              exit 1
            fi

            echo "All ${total} check(s) on ${sha} are green (required: ${INPUT_REQUIRED}):"
            printf '%s
' "${rows}" | sed 's/^/  /'
            exit 0

          if [ "${now}" -ge "${deadline}" ]; then
            echo "::error::Timed out after ${timeout_minutes}m waiting for checks on ${sha}. Still not completed:"
            printf '%s\n' "${pending}" | sed 's/^/  /'
            exit 1
          fi

          echo "Waiting for checks on ${sha} to complete (polling every ${poll_seconds}s):"
          if [ "${total}" -eq 0 ]; then
            echo "  (no check runs reported yet)"
          else
            printf '%s\n' "${pending}" | sed 's/^/  /'
          fi
          sleep "${poll_seconds}"
        done
